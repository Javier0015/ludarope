
services:
  db:
    image: postgres:18-alpine
    container_name: ludarope_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ludarope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ludarope_db
      TZ: America/Mexico_City
    ports:
      - "5433:5432"
    volumes:
      - ludarope_data:/var/lib/postgresql

volumes:
  ludarope_data:
